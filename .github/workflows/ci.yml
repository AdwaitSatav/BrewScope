# Builds the app on every pull request and every push to main.
# If `npm run build` fails, the PR shows a red ✗ so broken code is caught before it is merged.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci installs the exact versions from package-lock.json (clean, repeatable installs).
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
